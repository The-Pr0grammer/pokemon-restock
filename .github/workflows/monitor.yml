name: Pokemon TCG Restock Monitor

on:
  workflow_dispatch:
    inputs:
      init:
        description: 'Force initialization (re-baseline all products without notifying)'
        type: boolean
        default: false
      dry_run:
        description: 'Dry run (scrape + compare, skip notifications and state write)'
        type: boolean
        default: true

concurrency:
  group: monitor
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    env:
      # Notification routing
      NOTIFY_CHANNELS:     ${{ vars.NOTIFY_CHANNELS || 'discord' }}
      DISCORD_MENTION:     ${{ vars.DISCORD_MENTION || '<@519659187182108698>' }}

      # Discord
      DISCORD_WEBHOOK_URL:           ${{ secrets.DISCORD_WEBHOOK_URL }}
      DISCORD_COMMUNITY_WEBHOOK_URL: ${{ secrets.DISCORD_COMMUNITY_WEBHOOK_URL }}

      # Email
      EMAIL_ENABLED: ${{ secrets.EMAIL_ENABLED || 'false' }}
      EMAIL_FROM:    ${{ secrets.EMAIL_FROM }}
      EMAIL_TO:      ${{ secrets.EMAIL_TO }}
      SMTP_HOST:     ${{ secrets.SMTP_HOST }}
      SMTP_PORT:     ${{ secrets.SMTP_PORT }}
      SMTP_SECURE:   ${{ secrets.SMTP_SECURE }}
      SMTP_USER:     ${{ secrets.SMTP_USER }}
      SMTP_PASS:     ${{ secrets.SMTP_PASS }}

      # Retailers — existing
      BESTBUY_API_KEY:  ${{ secrets.BESTBUY_API_KEY }}
      TARGET_ENABLED:   ${{ vars.TARGET_ENABLED   || 'true' }}
      WALMART_ENABLED:  ${{ vars.WALMART_ENABLED  || 'true' }}
      BESTBUY_ENABLED:  ${{ vars.BESTBUY_ENABLED  || 'true' }}
      BESTBUY_HTML_FALLBACK_ENABLED: ${{ vars.BESTBUY_HTML_FALLBACK_ENABLED || 'false' }}

      # Retailers — new
      AMAZON_ENABLED:      ${{ vars.AMAZON_ENABLED      || 'true' }}
      AMAZON_ACCESS_KEY:   ${{ secrets.AMAZON_ACCESS_KEY }}
      AMAZON_SECRET_KEY:   ${{ secrets.AMAZON_SECRET_KEY }}
      AMAZON_PARTNER_TAG:  ${{ secrets.AMAZON_PARTNER_TAG }}
      AMAZON_FBA_ONLY:     ${{ vars.AMAZON_FBA_ONLY     || 'false' }}
      GAMESTOP_ENABLED:    ${{ vars.GAMESTOP_ENABLED     || 'true' }}
      BN_ENABLED:          ${{ vars.BN_ENABLED           || 'true' }}
      COSTCO_ENABLED:      ${{ vars.COSTCO_ENABLED       || 'true' }}
      SAMSCLUB_ENABLED:    ${{ vars.SAMSCLUB_ENABLED     || 'true' }}
      PC_ENABLED:          ${{ vars.PC_ENABLED           || 'true' }}
      PC_COOKIE:           ${{ secrets.PC_COOKIE }}
      PC_WATCH_URLS:       ${{ vars.PC_WATCH_URLS }}
      PC_QUEUEIT_IDS:      ${{ vars.PC_QUEUEIT_IDS }}
      PC_QUEUE_MENTION_EVERYONE: ${{ vars.PC_QUEUE_MENTION_EVERYONE || 'false' }}

      # Community monitors
      REDDIT_ENABLED:     ${{ vars.REDDIT_ENABLED     || 'true' }}
      REDDIT_SUBREDDITS:  ${{ vars.REDDIT_SUBREDDITS  || 'PokemonTCG,PokeInvesting' }}

      # Search / filter
      SEARCH_KEYWORDS: ${{ vars.SEARCH_KEYWORDS }}
      FILTER_KEYWORDS: ${{ vars.FILTER_KEYWORDS }}
      MAX_PAGES:       ${{ vars.MAX_PAGES || '3' }}
      DRY_RUN_MAX_PAGES: ${{ vars.DRY_RUN_MAX_PAGES || '1' }}
      OBSERVATION_SOURCE: ${{ vars.OBSERVATION_SOURCE || 'all' }}
      BN_DRY_RUN_KEYWORD_LIMIT: ${{ vars.BN_DRY_RUN_KEYWORD_LIMIT || '6' }}
      SOURCE_TIMEOUT_MS: ${{ vars.SOURCE_TIMEOUT_MS || '12000' }}
      PC_QUEUE_SOURCE_TIMEOUT_MS: ${{ vars.PC_QUEUE_SOURCE_TIMEOUT_MS || '8000' }}
      MSRP_SOURCE_TIMEOUT_MS: ${{ vars.MSRP_SOURCE_TIMEOUT_MS || '12000' }}
      BESTBUY_SOURCE_TIMEOUT_MS: ${{ vars.BESTBUY_SOURCE_TIMEOUT_MS || '9000' }}
      BN_SOURCE_TIMEOUT_MS: ${{ vars.BN_SOURCE_TIMEOUT_MS || '16000' }}
      COSTCO_SOURCE_TIMEOUT_MS: ${{ vars.COSTCO_SOURCE_TIMEOUT_MS || '12000' }}
      SAMSCLUB_SOURCE_TIMEOUT_MS: ${{ vars.SAMSCLUB_SOURCE_TIMEOUT_MS || '12000' }}
      REDDIT_SOURCE_TIMEOUT_MS: ${{ vars.REDDIT_SOURCE_TIMEOUT_MS || '8000' }}
      BESTBUY_HTML_TIMEOUT_MS: ${{ vars.BESTBUY_HTML_TIMEOUT_MS || '8000' }}
      BESTBUY_HTML_MAX_ATTEMPTS: ${{ vars.BESTBUY_HTML_MAX_ATTEMPTS || '1' }}
      PTCG_API_KEY: ${{ secrets.PTCG_API_KEY }}
      PTCG_API_SEARCH_LIMIT: ${{ vars.PTCG_API_SEARCH_LIMIT || '5' }}
      PTCG_API_MIN_MATCH_SCORE: ${{ vars.PTCG_API_MIN_MATCH_SCORE || '0.72' }}
      JUSTTCG_API_KEY: ${{ secrets.JUSTTCG_API_KEY }}
      JUSTTCG_SEARCH_LIMIT: ${{ vars.JUSTTCG_SEARCH_LIMIT || '10' }}
      JUSTTCG_MIN_MATCH_SCORE: ${{ vars.JUSTTCG_MIN_MATCH_SCORE || '0.72' }}
      MARKET_PRICE_MAX_OBSERVATIONS: ${{ vars.MARKET_PRICE_MAX_OBSERVATIONS || '12' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline

      - name: Run monitor
        id: monitor
        run: |
          set -o pipefail
          mkdir -p artifacts/restock-dry-run
          FLAGS="--once"
          if [[ "${{ github.event.inputs.init }}" == "true" ]]; then
            FLAGS="$FLAGS --init"
          fi
          if [[ "${{ github.event.inputs.dry_run }}" == "true" ]]; then
            FLAGS="$FLAGS --test"
            export MAX_PAGES="$DRY_RUN_MAX_PAGES"
            export SOURCE_STATUS_FILE="artifacts/restock-dry-run/source-statuses.json"
            export OBSERVATIONS_FILE="artifacts/restock-dry-run/observations.json"
            export MARKET_ESTIMATES_FILE="artifacts/restock-dry-run/market-estimates.json"
            export OPPORTUNITY_CANDIDATES_FILE="artifacts/restock-dry-run/opportunity-candidates.json"
            if [[ "$OBSERVATION_SOURCE" == "barnesandnoble" || "$OBSERVATION_SOURCE" == "all" ]]; then
              export BN_ENABLED="true"
              export BN_KEYWORD_LIMIT="$BN_DRY_RUN_KEYWORD_LIMIT"
            fi
          fi
          node monitor.js $FLAGS 2>&1 | tee artifacts/restock-dry-run/monitor.log

      - name: Generate dry-run dashboard
        if: ${{ always() && github.event.inputs.dry_run == 'true' }}
        run: node tools/generate-observations-dashboard.js artifacts/restock-dry-run/observations.json artifacts/restock-dry-run/dashboard.html

      - name: Isolate dry-run state mutations
        if: ${{ always() && github.event.inputs.dry_run == 'true' }}
        run: |
          mkdir -p artifacts/restock-dry-run
          git restore --worktree --staged -- data/pc-queue-history.json data/products.json data/msrp-database.json 2>/dev/null || true
          git clean -f -- data/reddit-seen.json 2>/dev/null || true
          git status --short --untracked-files=all > artifacts/restock-dry-run/worktree-status-full.txt
          grep -v '^?? artifacts/' artifacts/restock-dry-run/worktree-status-full.txt > artifacts/restock-dry-run/worktree-status-after-cleanup.txt || true

      - name: Upload dry-run artifact
        if: ${{ always() && github.event.inputs.dry_run == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: restock-dry-run
          path: artifacts/restock-dry-run/
          if-no-files-found: error

      - name: Commit updated data files
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Stage both state files if they exist and have changes
          git add data/products.json data/msrp-database.json 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "No data changes to commit."
            exit 0
          fi

          git commit -m "chore: update monitor data [skip ci]"

          # Pull-rebase + retry push to survive concurrent runs
          for attempt in 1 2 3; do
            git pull --rebase origin "${{ github.ref_name }}" && \
            git push origin HEAD:"${{ github.ref_name }}" && break
            echo "Push attempt $attempt failed — retrying in 10s…"
            sleep 10
          done

      - name: Write job summary
        if: always()
        run: |
          echo "## Pokemon TCG Monitor — $(date -u '+%Y-%m-%d %H:%M UTC')" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Setting | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Trigger | \`${{ github.event_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Init mode | \`${{ github.event.inputs.init || 'false' }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Dry run | \`${{ github.event.inputs.dry_run || 'false' }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Channels | \`${{ vars.NOTIFY_CHANNELS || 'discord' }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Job status | \`${{ job.status }}\` |" >> "$GITHUB_STEP_SUMMARY"

      - name: Notify Discord on failure
        if: ${{ failure() && github.event.inputs.dry_run != 'true' }}
        run: |
          PAYLOAD=$(jq -n \
            --arg title "Pokemon TCG Monitor failed" \
            --arg desc "Workflow run **${{ github.run_number }}** failed on branch \`${{ github.ref_name }}\`.\n\n[View run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})" \
            '{embeds:[{title:$title,description:$desc,color:15158332}]}')
          curl -s -o /dev/null \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" \
            "$DISCORD_WEBHOOK_URL" || true
